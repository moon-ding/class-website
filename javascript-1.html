    //document.querySelector("p").style.color = "red";

    const pList = document.querySelectorAll("p")
    //getting all p's and put into pList

    const springButton = document.getElementById("spring-button");
    const valentinesButton = document.getElementById("valentines-button");

    springButton.addEventListener("click",function(){
        for (let i=0; i< pList.length;i++){
            pList[i].classList.value=''; //reset to default value
            pList[i].classList.add("spring");
        }
    })
    valentinesButton.addEventListener("click",function(){
        for (let i=0; i< pList.length;i++){
            pList[i].classList.value=''; //reset to default value
            pList[i].classList.add("valentines");
        }
    })
    </script>
